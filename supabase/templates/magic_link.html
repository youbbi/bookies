<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin: 0; padding: 0; background-color: #f5e6d3; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f5e6d3; padding: 40px 20px;">
    <tr>
      <td align="center">
        <table width="100%" cellpadding="0" cellspacing="0" style="max-width: 420px; background-color: #fff8f0; border-radius: 12px; box-shadow: 0 2px 8px rgba(61, 41, 20, 0.08);">
          <!-- Header -->
          <tr>
            <td align="center" style="padding: 40px 30px 20px;">
              <h1 style="margin: 0; font-family: Georgia, Cambria, 'Times New Roman', serif; font-size: 32px; color: #5c4033; font-weight: normal;">
                Bookies
              </h1>
              <p style="margin: 8px 0 0; font-size: 14px; color: #9c7c52;">
                Partagez vos livres avec vos proches
              </p>
            </td>
          </tr>
          <!-- Content -->
          <tr>
            <td style="padding: 20px 30px 30px;">
              <p style="margin: 0 0 24px; font-size: 16px; color: #3d2914; text-align: center; line-height: 1.5;">
                Cliquez sur le bouton ci-dessous pour vous connecter. Ce lien expire dans 1 heure.
              </p>
              <table width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center">
                    <a href="{{ .ConfirmationURL }}" style="display: inline-block; background-color: #c4956a; color: #fff8f0; text-decoration: none; padding: 14px 32px; border-radius: 8px; font-size: 16px; font-weight: 500;">
                      Se connecter
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="padding: 20px 30px 30px; border-top: 1px solid #e8d4be;">
              <p style="margin: 0; font-size: 12px; color: #9c7c52; text-align: center; line-height: 1.5;">
                Si vous n'avez pas demandé ce lien, vous pouvez ignorer ce courriel.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
